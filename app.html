<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inside Her Head</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --font: 'Outfit', sans-serif;
      --font-serif: 'Playfair Display', serif;
      --ink: #0d0c0b;
      --smoke: #1a1816;
      --cream: #e8e4df;
      --muted: #6b6560;
      --glow: rgba(200, 180, 160, 0.15);
      --accent: #c9a86c;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--ink);
      color: var(--cream);
      min-height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      cursor: none;
    }

    /* ---------- FOOTPRINT CURSOR ---------- */
    .cursor-footprints {
      position: fixed;
      width: 30px;
      height: 26px;
      margin-left: -15px;
      margin-top: -13px;
      pointer-events: none;
      z-index: 99999;
      transition: left 0.06s ease-out, top 0.06s ease-out;
      visibility: hidden;
    }
    .cursor-footprints.visible { visibility: visible; }
    .cursor-footprints.stomp {
      animation: cursorStomp 0.2s ease-out forwards;
    }
    @keyframes cursorStomp {
      0% { transform: scale(1); }
      45% { transform: scale(0.7) translateY(3px); }
      100% { transform: scale(1); }
    }
    .cursor-footprints svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    }
    .click-footprints {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99998;
    }
    .click-footprint {
      position: absolute;
      width: 26px;
      height: 22px;
      margin-left: -13px;
      margin-top: -11px;
      opacity: 0.9;
      animation: footprintFade 0.9s ease-out forwards;
    }
    .click-footprint svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
    }
    .click-footprint:nth-child(odd) { transform: translate(-50%, -50%) rotate(-15deg) scale(0.8); }
    .click-footprint:nth-child(even) { transform: translate(-50%, -50%) rotate(12deg) scale(0.7); }
    @keyframes footprintFade {
      0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.5); }
      20% { opacity: 0.85; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); }
    }
    .click-footprint:nth-child(odd) { animation: footprintFadeOdd 0.9s ease-out forwards; }
    .click-footprint:nth-child(even) { animation: footprintFadeEven 0.9s ease-out forwards; }
    @keyframes footprintFadeOdd {
      0% { opacity: 0.9; transform: translate(-50%, -50%) rotate(-15deg) scale(0.5); }
      20% { opacity: 0.85; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(-15deg) scale(1); }
    }
    @keyframes footprintFadeEven {
      0% { opacity: 0.9; transform: translate(-50%, -50%) rotate(12deg) scale(0.5); }
      20% { opacity: 0.85; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(12deg) scale(0.9); }
    }

    /* ---------- COVER ---------- */
    .cover {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .cover.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .cover-bg-video {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .cover-bg-video video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.6) brightness(0.5) contrast(1.05);
      animation: coverVideoDrift 25s ease-in-out infinite alternate;
    }
    @keyframes coverVideoDrift {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.08) translate(1%, 0.5%); }
    }

    .cover-bg {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to bottom, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0.7) 100%);
    }
    .cover-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 100% 80% at 50% 45%, transparent 0%, transparent 35%, rgba(0,0,0,0.4) 100%);
    }
    .cover-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 45%, var(--glow) 0%, transparent 55%);
    }

    /* ----- Cover hero: your image, one central reveal ----- */
    .cover-bloom {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 2rem;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-bloom-center {
      width: 160px;
      height: 160px;
      background: url('https://static.wixstatic.com/media/0caac7_152558d99755492a9807423cadcbea00~mv2.png') center/contain no-repeat;
      filter: drop-shadow(0 0 30px rgba(201, 168, 108, 0.25)) sepia(0.08) contrast(1.02) brightness(1.02);
      opacity: 0;
      transform: scale(0.3);
      animation: coverReveal 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards, coverBreathe 5s ease-in-out 1.8s infinite;
    }

    @keyframes coverReveal {
      0% {
        opacity: 0;
        transform: scale(0.25);
        filter: drop-shadow(0 0 40px rgba(201, 168, 108, 0.15)) sepia(0.08) contrast(1.02) brightness(1.02) blur(8px);
      }
      50% {
        opacity: 0.7;
        filter: drop-shadow(0 0 35px rgba(201, 168, 108, 0.2)) sepia(0.08) contrast(1.02) brightness(1.02) blur(2px);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: drop-shadow(0 0 30px rgba(201, 168, 108, 0.25)) sepia(0.08) contrast(1.02) brightness(1.02) blur(0);
      }
    }

    @keyframes coverBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .cover-title {
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      text-align: center;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
    }
    /* Title drifts in word by word: soft blur to sharp, letters settling together */
    .cover-title .w {
      display: inline-block;
      opacity: 0;
      animation: titleDrift 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-play-state: paused;          /* waits until the title font has loaded */
    }
    .cover-title .w1 { animation-delay: 1.1s; }
    .cover-title .w2 { animation-delay: 1.75s; font-style: italic; font-weight: 400; }
    @keyframes titleDrift {
      0%   { opacity: 0; filter: blur(14px); letter-spacing: 0.14em; transform: translateY(10px); }
      35%  { opacity: 0.55; filter: blur(5px); }
      100% { opacity: 1; filter: blur(0); letter-spacing: 0.02em; transform: translateY(0); }
    }
    .fonts-ready .cover-title .w,
    .fonts-ready .cover-story,
    .fonts-ready .cover-hint { animation-play-state: running; }
    .cover-title { margin-bottom: 1.25rem; }
    .cover-story {
      font-family: var(--font-serif);
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      font-weight: 400;
      font-style: italic;
      color: var(--cream);
      opacity: 0;
      max-width: 28ch;
      margin: 0 auto 2rem;
      text-align: center;
      line-height: 1.7;
      position: relative;
      z-index: 1;
      animation: softIn 1.6s ease-out 3.1s forwards;
      animation-play-state: paused;
    }
    .cover-hint {
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      position: relative;
      z-index: 1;
      animation: softIn 1.2s ease-out 4.0s forwards, breathe 2.5s ease-in-out 5.2s infinite;
      animation-play-state: paused;
    }
    @keyframes softIn {
      from { opacity: 0; transform: translateY(8px); filter: blur(4px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ---------- SNIPPET VIEW ---------- */
    .snippet-view {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
    }
    .snippet-view.active { display: block; }

    .snippet-video-wrap {
      position: absolute;
      inset: 0;
    }
    .snippet-video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .snippet-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 35%, transparent 70%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
    }
    .snippet-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 50%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }
    /* Floating thought — like her inner voice / magical thinking */
    .snippet-thought {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-family: var(--font-serif);
      font-size: clamp(1rem, 3.5vw, 1.5rem);
      font-weight: 400;
      font-style: italic;
      color: rgba(255,255,255,0.92);
      text-align: center;
      max-width: 85%;
      line-height: 1.4;
      z-index: 2;
      opacity: 0;
      transition: opacity 1.2s ease;
      text-shadow: 0 1px 3px rgba(0,0,0,0.55), 0 2px 20px rgba(0,0,0,0.55);
    }
    .snippet-thought.visible { opacity: 1; }
    /* soft dark glow behind a thought that sits on bright petals */
    .snippet-thought.halo { padding: 0.6em 0.9em; border-radius: 40%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.22) 55%, transparent 75%); }
    .snippet-thought.fade-out { opacity: 0; transition-duration: 0.8s; }

    /* Counter: "1 / 6" and timer "0:10" */
    .snippet-counter {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      z-index: 2;
    }
    .snippet-timer {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      font-variant-numeric: tabular-nums;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.9);
      z-index: 2;
    }

    /* "Inside her head" label */
    .snippet-label {
      position: absolute;
      bottom: 5.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      z-index: 2;
    }

    /* Scrollable strip — seeds that bloom when you pick a moment */
    .daisy-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 5.5rem;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
      overflow: hidden;
    }
    .daisy-strip-inner {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.75rem;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      max-width: 100%;
    }
    .daisy-strip-inner::-webkit-scrollbar {
      display: none;
    }
    .daisy-strip-item {
      position: relative;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      cursor: pointer;
      border-radius: 50%;
      /* Seed: small dark dot by default */
      transform: scale(0.4);
      transition: transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1), filter 0.4s ease, opacity 0.35s ease, box-shadow 0.35s ease;
      background: url('https://static.wixstatic.com/media/0caac7_753031bee53a422aa890344aad594b11~mv2.png') center/contain no-repeat;
      filter: sepia(0.5) contrast(0.8) brightness(0.5);
      opacity: 0.9;
      box-shadow: 0 0 0 0 rgba(201, 168, 108, 0);
    }
    /* Seed shell — covers the daisy until it blooms */
    .daisy-strip-item::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: radial-gradient(ellipse 60% 60% at 50% 50%, #5c4a32 0%, #3d3228 50%, #2a231c 100%);
      opacity: 1;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .daisy-strip-item:hover {
      transform: scale(0.65);
      filter: sepia(0.35) contrast(0.9) brightness(0.75);
      opacity: 1;
    }
    .daisy-strip-item:hover::before {
      opacity: 0.6;
    }
    /* Bloomed: seed shell fades, daisy grows and glows */
    .daisy-strip-item.active {
      transform: scale(1.12);
      filter: sepia(0.12) contrast(1.02) brightness(0.98);
      opacity: 1;
      box-shadow: 0 0 0 2px rgba(201, 168, 108, 0.5), 0 0 20px rgba(201, 168, 108, 0.2);
    }
    .daisy-strip-item.active::before {
      opacity: 0;
      pointer-events: none;
    }
    /* One-time bloom animation when you pick a moment — spin + pop */
    .daisy-strip-item.blooming {
      animation: daisyBloom 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .daisy-strip-item.blooming::before {
      animation: seedCrack 0.5s ease-out forwards;
    }
    @keyframes daisyBloom {
      0% {
        transform: scale(0.4) rotate(-180deg);
        filter: sepia(0.5) contrast(0.8) brightness(0.5);
      }
      55% {
        transform: scale(1.2) rotate(8deg);
        filter: sepia(0.1) contrast(1.05) brightness(1.05);
      }
      100% {
        transform: scale(1.12) rotate(0deg);
        filter: sepia(0.12) contrast(1.02) brightness(0.98);
      }
    }
    @keyframes seedCrack {
      0% { opacity: 1; transform: scale(1); }
      40% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0; transform: scale(1.4); }
    }
    /* Optional: gentle idle sway on the bloomed daisy */
    .daisy-strip-item.active.idle {
      animation: daisyIdle 4s ease-in-out infinite;
    }
    @keyframes daisyIdle {
      0%, 100% { transform: scale(1.12) rotate(0deg); }
      25% { transform: scale(1.14) rotate(2deg); }
      75% { transform: scale(1.1) rotate(-1deg); }
    }

    /* Interference / glitch — only on the flower & ladybug moment */
    .snippet-interference {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: visibility 0.2s ease, opacity 0.15s ease;
    }
    .snippet-interference.visible {
      opacity: 1;
      visibility: visible;
    }
    .snippet-interference-text {
      font-family: var(--font);
      font-size: clamp(1.5rem, 6vw, 4rem);
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      text-shadow:
        0 0 20px rgba(201, 168, 108, 0.6),
        -2px 0 0 rgba(255, 80, 80, 0.8),
        2px 0 0 rgba(80, 200, 255, 0.8);
      animation: interferenceFlicker 0.12s ease-in-out infinite, interferenceGlitch 3s ease-in-out infinite;
    }
    @keyframes interferenceFlicker {
      0%, 40%, 60%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
      55% { opacity: 0.95; }
    }
    @keyframes interferenceGlitch {
      0%, 90%, 100% {
        transform: translate(0, 0) skew(0deg);
        text-shadow: -2px 0 0 rgba(255, 80, 80, 0.7), 2px 0 0 rgba(80, 200, 255, 0.7);
      }
      92% {
        transform: translate(-3px, 1px) skew(-1deg);
        text-shadow: -4px 2px 0 rgba(255, 80, 80, 0.9), 4px -2px 0 rgba(80, 200, 255, 0.9);
      }
      94% {
        transform: translate(2px, -1px) skew(0.5deg);
        text-shadow: 2px -1px 0 rgba(255, 80, 80, 0.8), -2px 1px 0 rgba(80, 200, 255, 0.8);
      }
      96% {
        transform: translate(0, 0) skew(0deg);
      }
    }
    .snippet-interference-scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      pointer-events: none;
    }

    /* Hidden on purpose: no "1 / 6" counter, no timer, no progress bar */
    .snippet-counter,
    .snippet-timer,
    .snippet-progress { display: none !important; }

    /* Progress bar */
    .snippet-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,0.15);
      z-index: 2;
    }
    .snippet-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    /* ---------- TRANSITION BETWEEN SNIPPETS ---------- */
    .snippet-view.transitioning .snippet-video-wrap {
      filter: brightness(0.35);
      transition: filter 0.4s ease-out;
    }
    .snippet-video-wrap {
      transition: filter 0.35s ease-out;
    }

    /* ---------- OUTRO (after the last snippet) ---------- */
    .outro {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--ink);
      cursor: pointer;
    }
    .outro.visible {
      display: flex;
      animation: outroIn 1s ease-out forwards;
    }
    @keyframes outroIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .outro-title {
      font-family: var(--font-serif);
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 400;
      font-style: italic;
      text-align: center;
      color: var(--cream);
      margin-bottom: 1.5rem;
      max-width: 18ch;
      line-height: 1.5;
    }
    .outro-sub {
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .outro-hint {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="cursor-footprints" id="cursorFootprints" aria-hidden="true">
    <svg viewBox="0 -1 40 34" fill="#c9a86c" opacity="0.95" xmlns="http://www.w3.org/2000/svg"><g transform="translate(19,1) scale(-1,1)"><path d="M10.5 31C6.8 31 5.6 28.2 6.2 24.6C6.7 21.4 4.6 18.6 4.4 14.6C4.2 10.6 7 8 10.6 8.2C14.4 8.4 16.4 11.2 16 15.4C15.7 18.6 14.4 20.6 14.7 24.2C15 28.4 13.8 31 10.5 31Z"/><circle cx="6" cy="4.6" r="2.5"/><circle cx="10" cy="3.4" r="1.8"/><circle cx="13.2" cy="4" r="1.5"/><circle cx="15.6" cy="5.7" r="1.3"/><circle cx="17.2" cy="8.2" r="1.1"/></g><g transform="translate(21,-1)"><path d="M10.5 31C6.8 31 5.6 28.2 6.2 24.6C6.7 21.4 4.6 18.6 4.4 14.6C4.2 10.6 7 8 10.6 8.2C14.4 8.4 16.4 11.2 16 15.4C15.7 18.6 14.4 20.6 14.7 24.2C15 28.4 13.8 31 10.5 31Z"/><circle cx="6" cy="4.6" r="2.5"/><circle cx="10" cy="3.4" r="1.8"/><circle cx="13.2" cy="4" r="1.5"/><circle cx="15.6" cy="5.7" r="1.3"/><circle cx="17.2" cy="8.2" r="1.1"/></g></svg>
  </div>
  <div class="click-footprints" id="clickFootprints"></div>

  <!-- COVER -->
  <section class="cover" id="cover" aria-label="Cover">
    <div class="cover-bg-video">
      <video id="coverBgVideo" autoplay muted loop playsinline>
        <source src="https://video.wixstatic.com/video/0caac7_518e8bd4fb8e45be83006060e8c767ff/1080p/mp4/file.mp4" type="video/mp4">
      </video>
    </div>
    <div class="cover-bg"></div>
    <div class="cover-bloom" aria-hidden="true">
      <div class="cover-bloom-center"></div>
    </div>
    <h1 class="cover-title"><span class="w w1">Inside</span> <span class="w w2">Her Head</span></h1>
    <p class="cover-story">Same street. Headphones on. What she hears—you hear.</p>
    <p class="cover-hint">Tap to walk</p>
  </section>

  <!-- SNIPPET VIEW (one at a time) -->
  <div class="snippet-view" id="snippetView" aria-hidden="true">
    <div class="snippet-video-wrap">
      <video id="snippetVideo" playsinline muted></video>
    </div>
    <div class="snippet-overlay"></div>
    <div class="snippet-vignette"></div>
    <p class="snippet-thought" id="snippetThought" aria-live="polite"></p>
    <div class="snippet-interference" id="snippetInterference" aria-hidden="true">
      <span class="snippet-interference-scanlines" aria-hidden="true"></span>
      <span class="snippet-interference-text">INTERFERENCE</span>
    </div>
    <div class="snippet-counter" id="snippetCounter">1 / 6</div>
    <div class="snippet-timer" id="snippetTimer">0:00 / 0:00</div>
    <p class="snippet-label">what she's hearing</p>
    <div class="daisy-strip" id="daisyStrip" role="listbox" aria-label="Pick a moment" tabindex="0">
      <div class="daisy-strip-inner" id="daisyStripInner"></div>
    </div>
    <div class="snippet-progress">
      <div class="snippet-progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- OUTRO (after last snippet) -->
  <section class="outro" id="outro" aria-label="End">
    <p class="outro-title">The pipes are still banging. She still thinks what she thinks.</p>
    <p class="outro-sub" id="outroSub">6 moments. One walk.</p>
    <p class="outro-hint">Tap to walk again</p>
  </section>

  <audio id="sharedAudio" preload="auto"></audio>

  <script>
    /* Start the title reveal only once its font is ready, so the letters never swap shape mid-fade.
       Safety net: start anyway after 2.5s. */
    (function () {
      var root = document.documentElement, started = false;
      function go() { if (!started) { started = true; root.classList.add('fonts-ready'); } }
      setTimeout(go, 2500);
      if (document.fonts && document.fonts.load) {
        Promise.all([
          document.fonts.load('400 1em "Playfair Display"'),
          document.fonts.load('italic 400 1em "Playfair Display"')
        ]).then(go, go);
      } else { go(); }
    })();

    (function () {
      var cursorEl = document.getElementById('cursorFootprints');
      var clickContainer = document.getElementById('clickFootprints');
      var footprintSvg = '<svg viewBox="0 -1 40 34" fill="#c9a86c" opacity="0.85" xmlns="http://www.w3.org/2000/svg"><g transform="translate(19,1) scale(-1,1)"><path d="M10.5 31C6.8 31 5.6 28.2 6.2 24.6C6.7 21.4 4.6 18.6 4.4 14.6C4.2 10.6 7 8 10.6 8.2C14.4 8.4 16.4 11.2 16 15.4C15.7 18.6 14.4 20.6 14.7 24.2C15 28.4 13.8 31 10.5 31Z"/><circle cx="6" cy="4.6" r="2.5"/><circle cx="10" cy="3.4" r="1.8"/><circle cx="13.2" cy="4" r="1.5"/><circle cx="15.6" cy="5.7" r="1.3"/><circle cx="17.2" cy="8.2" r="1.1"/></g><g transform="translate(21,-1)"><path d="M10.5 31C6.8 31 5.6 28.2 6.2 24.6C6.7 21.4 4.6 18.6 4.4 14.6C4.2 10.6 7 8 10.6 8.2C14.4 8.4 16.4 11.2 16 15.4C15.7 18.6 14.4 20.6 14.7 24.2C15 28.4 13.8 31 10.5 31Z"/><circle cx="6" cy="4.6" r="2.5"/><circle cx="10" cy="3.4" r="1.8"/><circle cx="13.2" cy="4" r="1.5"/><circle cx="15.6" cy="5.7" r="1.3"/><circle cx="17.2" cy="8.2" r="1.1"/></g></svg>';

      var clickAudioContext = null;
      function playClickSound() {
        try {
          if (!clickAudioContext) clickAudioContext = new (window.AudioContext || window.webkitAudioContext)();
          if (clickAudioContext.state === 'suspended') clickAudioContext.resume();
          var ctx = clickAudioContext;
          var t = ctx.currentTime;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(280, t);
          osc.frequency.exponentialRampToValueAtTime(140, t + 0.04);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.start(t);
          osc.stop(t + 0.12);
          var osc2 = ctx.createOscillator();
          var gain2 = ctx.createGain();
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(420, t);
          osc2.frequency.exponentialRampToValueAtTime(200, t + 0.03);
          gain2.gain.setValueAtTime(0.06, t);
          gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
          osc2.start(t);
          osc2.stop(t + 0.08);
        } catch (err) {}
      }

      function moveCursor(e) {
        cursorEl.classList.add('visible');
        var x = e.clientX;
        var y = e.clientY;
        cursorEl.style.left = x + 'px';
        cursorEl.style.top = y + 'px';
      }
      function onCursorClick(e) {
        playClickSound();
        var x = e.clientX;
        var y = e.clientY;
        cursorEl.classList.add('stomp');
        setTimeout(function () { cursorEl.classList.remove('stomp'); }, 220);
        var count = 3 + Math.floor(Math.random() * 2);
        for (var i = 0; i < count; i++) {
          var foot = document.createElement('div');
          foot.className = 'click-footprint';
          foot.style.left = (x + (Math.random() - 0.5) * 24) + 'px';
          foot.style.top = (y + (Math.random() - 0.5) * 20) + 'px';
          foot.innerHTML = footprintSvg;
          clickContainer.appendChild(foot);
          setTimeout(function (el) { if (el.parentNode) el.parentNode.removeChild(el); }, 950, foot);
        }
      }
      document.addEventListener('mousemove', moveCursor);
      document.addEventListener('mousedown', onCursorClick);
      document.addEventListener('touchstart', function (e) {
        if (e.touches.length) moveCursor(e.touches[0]);
      }, { passive: true });
      document.addEventListener('touchmove', function (e) {
        if (e.touches.length) moveCursor(e.touches[0]);
      }, { passive: true });
      document.addEventListener('touchend', function (e) {
        if (e.changedTouches.length) {
          var t = e.changedTouches[0];
          onCursorClick({ clientX: t.clientX, clientY: t.clientY });
        }
      }, { passive: true });

      var coverBgVideo = document.getElementById('coverBgVideo');
      if (coverBgVideo) coverBgVideo.playbackRate = 0.78;

      /* "We're Grand", chopped + fuzzed (made by tools/make_clips.sh).
         For Wix: upload the 5 files in audio/ to Wix Media and paste their URLs here. */
      const audios = [
        'audio/moment-1.mp3',   /* "We've been through fire... dance through the pain" */
        'audio/moment-2.mp3',   /* "A little smoke, the stereo spins... nobody wins like we win" */
        'audio/moment-3.mp3',   /* "I don't know what the world's made of... with your love" */
        /* Interference moment: the ladybug video's own sound (static + buzzing bee) */
        'https://video.wixstatic.com/video/0caac7_518e8bd4fb8e45be83006060e8c767ff/1080p/mp4/file.mp4',
        'audio/moment-5.mp3',   /* "I don't care what the world is made of / We were made to rise" */
        'audio/moment-6.mp3'    /* "We create and we climb... And that's by design" + the song's real ending */
      ];

      const videos = [
        'https://video.wixstatic.com/video/0caac7_80bc715166724c9e9686f734c88d03aa/1080p/mp4/file.mp4',
        'https://video.wixstatic.com/video/0caac7_46c4d4197f1d4eddaa7b99072c67d3cf/1080p/mp4/file.mp4',
        'https://video.wixstatic.com/video/0caac7_7ad90c0aff5245ff84affb97ab1f04bf/1080p/mp4/file.mp4',
        /* The "different" moment — flower & ladybug (keep it!) */
        'https://video.wixstatic.com/video/0caac7_518e8bd4fb8e45be83006060e8c767ff/1080p/mp4/file.mp4',
        'https://video.wixstatic.com/video/0caac7_6358a29e51c14368a158a07b5b70be28/1080p/mp4/file.mp4',
        'https://video.wixstatic.com/video/0caac7_4567c0b51d214f8fbd27e69d762a4450/1080p/mp4/file.mp4'
      ];

      // One floating thought per snippet — inner voice / magical thinking
      const thoughts = [
        'Just traffic. Or a heartbeat.',
        'Someone else\'s song through the wall.',
        'She doesn\'t mind the noise.',
        'Nothing else in the room.',
        'Sounds like something leaving.',
        'The street gets quiet when she turns it up.'
      ];

      const cover = document.getElementById('cover');
      const snippetView = document.getElementById('snippetView');
      const snippetVideo = document.getElementById('snippetVideo');
      const sharedAudio = document.getElementById('sharedAudio');
      const snippetCounter = document.getElementById('snippetCounter');
      const snippetTimer = document.getElementById('snippetTimer');
      const progressFill = document.getElementById('progressFill');
      const daisyStrip = document.getElementById('daisyStrip');
      const daisyStripInner = document.getElementById('daisyStripInner');
      const snippetThought = document.getElementById('snippetThought');
      const snippetInterference = document.getElementById('snippetInterference');
      const outro = document.getElementById('outro');
      const outroSub = document.getElementById('outroSub');

      const SEGMENTS = audios.length;
      const INTERFERENCE_INDEX = 3;  /* flower & ladybug moment — show glitch */

      // Build scrollable strip of daisies — one per moment, scales to any number
      daisyStripInner.innerHTML = '';
      for (var i = 0; i < SEGMENTS; i++) {
        var item = document.createElement('div');
        item.className = 'daisy-strip-item';
        item.setAttribute('data-index', String(i));
        item.setAttribute('role', 'option');
        item.setAttribute('aria-label', 'Moment ' + (i + 1));
        item.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
        daisyStripInner.appendChild(item);
      }
      if (outroSub) outroSub.textContent = SEGMENTS + ' moments. One walk.';

      let currentIndex = 0;
      let progressId = null;
      let thoughtTimeoutId = null;
      let thoughtFadeId = null;

      function showCover() {
        cover.classList.remove('hidden');
        snippetView.classList.remove('active');
        snippetView.setAttribute('aria-hidden', 'true');
      }

      function hideCover() {
        cover.classList.add('hidden');
        snippetView.classList.add('active');
        snippetView.setAttribute('aria-hidden', 'false');
        goToSnippet(0);
      }

      function clearThoughtTimers() {
        if (thoughtTimeoutId) clearTimeout(thoughtTimeoutId);
        if (thoughtFadeId) clearTimeout(thoughtFadeId);
        thoughtTimeoutId = thoughtFadeId = null;
      }

      /* Where each moment's thought sits, so it never covers her face.
         side: which side of the screen; top: how far down (% of the screen); width: optional max width (%).
         On tall screens (phones) there's no side room, so thoughts sit low, above the daisies. */
      const THOUGHT_SPOTS = [
        { side: 'left',  top: 68 },  /* 1: she's center-left — meadow + shirt edge */
        { side: 'right', top: 45 },  /* 2: she's on the left, looking up — open meadow */
        { side: 'right', top: 78 },  /* 3: camera drifts right — low right stays off her face */
        { side: 'right', top: 85, halo: true },  /* 4: interference — the daisy fills the frame, so a soft glow keeps it readable */
        { side: 'left',  top: 70 },  /* 5: she's centered — beside her hair, over the flowers */
        { side: 'left',  top: 22, width: 19 }   /* 6: upper left — open meadow and trees the whole clip */
      ];

      function placeThought(index) {
        var spot = THOUGHT_SPOTS[index] || { side: 'center', top: 45 };
        var st = snippetThought.style;
        var aspect = window.innerWidth / window.innerHeight;
        if (aspect < 0.9 || spot.side === 'center') {
          snippetThought.classList.toggle('halo', !!spot.halo);
          st.left = '50%'; st.right = 'auto';
          st.top = 'auto'; st.bottom = '7.5rem';
          st.transform = 'translateX(-50%)';
          st.textAlign = 'center'; st.maxWidth = '85%';
          return;
        }
        snippetThought.classList.toggle('halo', !!spot.halo);
        st.top = spot.top + '%'; st.bottom = 'auto';
        st.transform = 'translateY(-50%)';
        st.maxWidth = spot.width ? spot.width + '%' : (aspect < 1.5 ? '24%' : '28%');
        st.textAlign = spot.side;
        if (spot.side === 'left') { st.left = '5%'; st.right = 'auto'; }
        else { st.right = '5%'; st.left = 'auto'; }
      }
      window.addEventListener('resize', function () { placeThought(currentIndex); });

      function showThought(index, audioDuration) {
        clearThoughtTimers();
        placeThought(index);
        snippetThought.textContent = thoughts[index] || '';
        snippetThought.classList.remove('visible', 'fade-out');
        snippetThought.offsetHeight;
        var fadeOutMs = (typeof audioDuration === 'number' && audioDuration > 4)
          ? (audioDuration - 2) * 1000
          : 8000;
        thoughtTimeoutId = setTimeout(function () {
          snippetThought.classList.add('visible');
          thoughtFadeId = setTimeout(function () {
            snippetThought.classList.add('fade-out');
          }, fadeOutMs);
        }, 1500);
      }

      function setThoughtFadeFromDuration(audioDuration) {
        if (thoughtFadeId) clearTimeout(thoughtFadeId);
        if (typeof audioDuration !== 'number' || audioDuration <= 4) return;
        var fadeAt = (audioDuration - 2) * 1000;
        var elapsed = sharedAudio.currentTime * 1000;
        var delay = Math.max(0, fadeAt - elapsed);
        thoughtFadeId = setTimeout(function () {
          snippetThought.classList.add('fade-out');
        }, delay);
      }

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
        var m = Math.floor(seconds / 60);
        var s = Math.floor(seconds % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      function updateProgress() {
        var t = sharedAudio.currentTime;
        var d = sharedAudio.duration;
        if (Number.isFinite(d) && d > 0) {
          progressFill.style.width = Math.min(100, (t / d) * 100) + '%';
          snippetTimer.textContent = formatTime(t) + ' / ' + formatTime(d);
        } else {
          progressFill.style.width = '0%';
          snippetTimer.textContent = formatTime(t) + ' / —';
        }
      }

      /* If a song clip is longer than its video, slow the video down just enough
         that it plays once, start to finish, across the whole clip (no restart). */
      function fitVideoToSound(index) {
        var vReady = false, aReady = false;
        function fit() {
          if (!vReady || !aReady || currentIndex !== index) return;
          var v = snippetVideo.duration, a = sharedAudio.duration;
          if (!Number.isFinite(v) || !Number.isFinite(a) || v <= 0 || a <= 0) return;
          var rate = a > v ? (v / a) * 0.995 : 1;
          snippetVideo.playbackRate = rate;
          snippetVideo.defaultPlaybackRate = rate;
        }
        function onV() { vReady = true; fit(); }
        function onA() { aReady = true; fit(); }
        if (snippetVideo.readyState >= 1) vReady = true; else snippetVideo.addEventListener('loadedmetadata', onV, { once: true });
        if (sharedAudio.readyState >= 1 && sharedAudio.src.indexOf(audios[index]) !== -1) aReady = true; else sharedAudio.addEventListener('loadedmetadata', onA, { once: true });
        fit();
      }

      function goToSnippet(index) {
        index = Math.max(0, Math.min(index, videos.length - 1));
        currentIndex = index;

        if (progressId) clearInterval(progressId);
        clearThoughtTimers();
        snippetVideo.pause();
        sharedAudio.pause();
        snippetView.classList.remove('transitioning');
        snippetVideo.style.filter = '';

        snippetVideo.src = videos[index];
        snippetVideo.loop = false;  /* one smooth pass — never jumps back to the start */
        snippetVideo.muted = true;  /* videos stay silent — only the overlaid sound plays */
        snippetVideo.playbackRate = 1;
        snippetVideo.load();
        fitVideoToSound(index);

        snippetCounter.textContent = (index + 1) + ' / ' + videos.length;
        progressFill.style.width = '0%';
        snippetTimer.textContent = '0:00 / —';
        snippetThought.classList.remove('visible', 'fade-out');
        snippetThought.textContent = thoughts[index] || '';

        snippetVideo.play().catch(function () {});
        sharedAudio.src = audios[index];
        sharedAudio.load();
        sharedAudio.currentTime = 0;
        sharedAudio.play().catch(function () {});

        progressId = setInterval(updateProgress, 150);
        var dur = sharedAudio.duration;
        showThought(index, Number.isFinite(dur) ? dur : null);
        sharedAudio.addEventListener('loadedmetadata', function onMeta() {
          sharedAudio.removeEventListener('loadedmetadata', onMeta);
          var d = sharedAudio.duration;
          if (Number.isFinite(d)) setThoughtFadeFromDuration(d);
        });

        syncStripToIndex(index);
        if (snippetInterference) {
          var showGlitch = index === INTERFERENCE_INDEX;
          snippetInterference.classList.toggle('visible', showGlitch);
          snippetInterference.setAttribute('aria-hidden', showGlitch ? 'false' : 'true');
        }
      }

      function syncStripToIndex(index) {
        currentIndex = index;
        var items = daisyStripInner.querySelectorAll('.daisy-strip-item');
        items.forEach(function (el, i) {
          var isActive = i === index;
          el.classList.remove('blooming', 'idle');
          el.classList.toggle('active', isActive);
          el.setAttribute('aria-selected', isActive ? 'true' : 'false');
          if (isActive) {
            el.classList.add('blooming');
            setTimeout(function () {
              el.classList.remove('blooming');
              el.classList.add('idle');
            }, 620);
          }
        });
        var activeEl = items[index];
        if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }

      function onAudioEnded() {
        if (progressId) clearInterval(progressId);
        clearThoughtTimers();
        if (currentIndex < videos.length - 1) {
          snippetView.classList.add('transitioning');
          setTimeout(function () {
            goToSnippet(currentIndex + 1);
          }, 420);
        } else {
          snippetVideo.pause();
          progressFill.style.width = '100%';
          snippetTimer.textContent = formatTime(sharedAudio.duration) + ' / ' + formatTime(sharedAudio.duration);
          snippetThought.classList.remove('visible', 'fade-out');
          setTimeout(function () {
            snippetView.classList.remove('active');
            outro.classList.add('visible');
          }, 600);
        }
      }

      cover.addEventListener('click', function () {
        if (cover.classList.contains('hidden')) return;
        hideCover();
      });

      outro.addEventListener('click', function () {
        if (!outro.classList.contains('visible')) return;
        outro.classList.remove('visible');
        cover.classList.remove('hidden');
        snippetView.classList.remove('active');
        snippetView.setAttribute('aria-hidden', 'true');
      });

      (function initStrip() {
        function onItemClick(el) {
          var i = parseInt(el.getAttribute('data-index'), 10);
          if (!isNaN(i)) goToSnippet(i);
        }
        daisyStripInner.querySelectorAll('.daisy-strip-item').forEach(function (item) {
          item.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            onItemClick(item);
          });
          item.addEventListener('touchend', function (e) {
            e.preventDefault();
            e.stopPropagation();
            onItemClick(item);
          }, { passive: false });
        });
        daisyStrip.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
            e.preventDefault();
            goToSnippet(Math.max(0, currentIndex - 1));
          } else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
            e.preventDefault();
            goToSnippet(Math.min(videos.length - 1, currentIndex + 1));
          }
        });
      })();

      sharedAudio.addEventListener('ended', onAudioEnded);

      // Start with cover visible, snippet view inactive
      snippetView.classList.remove('active');
      snippetView.setAttribute('aria-hidden', 'true');
    })();
  </script>
</body>
</html>
